<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060a14">
  <title>우주 레이싱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="./css/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body data-state="loading">
  <canvas id="scene" aria-label="코스 3D 화면"></canvas>

  <section id="loading" aria-live="polite">
    <div class="load-inner">
      <h1 class="title">우주 레이싱</h1>
      <p class="title-sub">달과 행성을 달리는 학급 레이싱</p>
      <div class="load-track"><span id="load-bar"></span></div>
      <p id="load-step">시작하는 중</p>
    </div>
  </section>

  <header class="topbar">
    <span class="brand">우주 레이싱</span>
    <span class="build">1-B 연습 주행</span>
  </header>

  <aside class="course-card" aria-label="코스 정보">
    <p id="course-group" class="course-group"></p>
    <h2 id="course-name" class="course-name"></h2>
    <dl class="stats">
      <div><dt>길이</dt><dd><span id="stat-length"></span><small>m</small></dd></div>
      <div><dt>바퀴</dt><dd><span id="stat-laps"></span></dd></div>
      <div><dt>높낮이</dt><dd><span id="stat-rise"></span><small>m</small></dd></div>
      <div><dt>중력</dt><dd><span id="stat-gravity"></span><small>m/s²</small></dd></div>
    </dl>
    <div class="views" role="group" aria-label="보기 방식">
      <button type="button" data-view="tour"><kbd>1</kbd>둘러보기</button>
      <button type="button" data-view="top"><kbd>2</kbd>위에서</button>
      <button type="button" data-view="free"><kbd>3</kbd>자유롭게</button>
    </div>
    <p id="view-hint" class="hint"></p>
    <button type="button" id="start-race" class="primary">연습 주행 시작 <kbd>Enter</kbd></button>
  </aside>

  <section id="hud" hidden aria-label="경기 정보">
    <div class="hud-panel hud-lap">
      <p class="hud-label">바퀴</p>
      <p class="hud-big"><b id="hud-lap">1</b><span>/<span id="hud-laps">3</span></span></p>
      <dl>
        <div><dt>이번 바퀴</dt><dd id="hud-lap-time">0:00.000</dd></div>
        <div><dt>내 최고</dt><dd id="hud-best">-</dd></div>
      </dl>
    </div>
    <div class="hud-panel hud-total">
      <p class="hud-label">총 시간</p>
      <p id="hud-total" class="hud-time">0:00.000</p>
    </div>
    <canvas id="minimap" aria-label="코스 지도"></canvas>
    <div class="hud-panel hud-speed">
      <p><b id="hud-speed">0</b><span>km/h</span></p>
      <div class="speed-track"><span id="hud-speed-bar"></span></div>
    </div>
    <div class="hud-panel hud-help">
      <p><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 달리기</p>
      <p><kbd>Space</kbd> 미끄러지며 돌기</p>
      <p><kbd>C</kbd> 카메라 <span id="hud-cam">멀리</span> · <kbd>R</kbd> 주행선으로</p>
      <p><kbd>P</kbd> 일시 정지</p>
      <button type="button" id="hud-exit">그만 달리기</button>
    </div>
    <p id="hud-count" aria-live="assertive"></p>
    <p id="hud-toast" aria-live="polite"></p>
  </section>

  <dialog id="results" aria-labelledby="result-title">
    <h2 id="result-title">완주</h2>
    <p class="result-total-label">총 시간</p>
    <p id="result-total" class="result-total"></p>
    <ol id="result-laps" class="result-laps"></ol>
    <p id="result-note" class="result-note"></p>
    <div class="result-actions">
      <button type="button" id="result-again" class="primary">다시 달리기</button>
      <button type="button" id="result-lobby">코스 보기로</button>
    </div>
  </dialog>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
